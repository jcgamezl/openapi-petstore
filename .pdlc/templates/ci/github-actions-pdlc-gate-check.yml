# .github/workflows/pdlc-gate-check.yml — generated by the PDLC spine, do
# not hand-edit. Re-distributed automatically by `spine distribute-runtime`
# / `spine distribute-all` whenever the spine fork re-compiles into this
# repo (or via `spine compile --out <path>`, which distributes it too).
#
# Why this exists: hooks are advisory — they run in an agent's local
# session, and a human (or an agent told to) can skip past them. A
# required GitHub check on the PR cannot be talked around by whoever or
# whatever is pushing the commit. This is the real backstop; hooks are the
# fast local feedback loop.
#
# What it checks: every ticket directory committed on this branch
# (pdlc/<TICKET-ID>/phase-state.json + its artifacts). In-flight tickets
# must have a clear gate for their current phase; completed tickets pass;
# a branch with no ticket directories at all (main before the first PDLC
# merge, a non-PDLC PR) passes with a notice — a permanently red check
# just gets switched off.
#
# For this to actually gate merges, add "PDLC gate check" as a required
# status check in this repo's branch protection rules — the workflow
# existing on its own does not block anything by itself. Protect the
# approval record too: a CODEOWNERS rule on `pdlc/**` requiring review by
# the approvers (product owner / engineering lead / release manager)
# stops a PR author from editing their own phase-state.json or
# approval_evidence unreviewed.
name: PDLC gate check

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gate-check's escalation check diffs the working tree against
          # base_ref (the commit the ticket's worktree started from) — a
          # shallow checkout would make that diff unreliable.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify .pdlc/ runtime is present
        run: |
          if [ ! -f .pdlc/bin/spine.js ]; then
            echo "::error::.pdlc/bin/spine.js not found — this repo has not had the PDLC runtime distributed into it yet (or .pdlc/ was not committed). Run \`spine distribute-runtime\` (or \`spine compile\`) from the spine fork against this repo and commit .pdlc/."
            exit 1
          fi

      - name: Run gate-check on every ticket directory on this branch
        run: node .pdlc/bin/spine.js gate-check
